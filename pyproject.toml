[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "accessible-maps-data"
version = "0.1.0"
description = "Geospatial accessibility data pipeline for Accessible Maps"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.0",
    "pyogrio>=0.9",
    "shapely>=2.0",
    "pandas>=2.0",
    "requests>=2.31",
    "cryptography>=42.0",
    "pydantic>=2.7",
    "zstandard>=0.22",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
accessible-maps-build = "accessible_maps.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
